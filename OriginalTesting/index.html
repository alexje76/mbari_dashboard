<!-- Simple Card of reading in the yaml file for the buoy-->>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buoy Dashboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { width: min(420px, calc(100% - 2rem)); padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 8px 30px #17203318; }
    h1 { margin-top: 0; }
    .row { display: flex; justify-content: space-between; padding: .65rem 0; border-bottom: 1px solid #e5e9f0; }
    .result { margin-top: 1.25rem; padding: 1rem; border-radius: 10px; background: #eef4ff; font-size: 1.2rem; font-weight: 700; }
    .status { display: flex; align-items: center; gap: .6rem; margin-top: 1rem; font-weight: 600; }
    .light { width: 16px; height: 16px; border-radius: 50%; background: #9aa4b2; box-shadow: 0 0 0 4px #17203318; }
    .light.on { background: #22c55e; box-shadow: 0 0 0 4px #22c55e33, 0 0 14px #22c55e; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Buoy 156</h1>
    <div id="content">Loading…</div>
  </main>

  <script>
    // Reads the simple key/value YAML file without needing a server or library.
    function parseYaml(text) {
      return Object.fromEntries(text.split(/\r?\n/)
        .map(line => line.match(/^\s*([^:#]+):\s*(.*?)\s*$/))
        .filter(Boolean)
        .map(([, key, value]) => [key.trim(),
          value === 'true' ? true : value === 'false' ? false :
          /^-?\d+(\.\d+)?$/.test(value) ? Number(value) : value.replace(/^['"]|['"]$/g, '')
        ]));
    }

    fetch('./Tester.yaml')
      .then(response => {
        if (!response.ok) throw new Error('Could not load Tester.yaml');
        return response.text();
      })
      .then(text => {
        const data = parseYaml(text);
        const product = data.hs * data.tp;
        document.getElementById('content').innerHTML = `
          <div class="row"><span>Buoy</span><strong>${data.buoy}</strong></div>
          <div class="row"><span>hs</span><strong>${data.hs}</strong></div>
          <div class="row"><span>tp</span><strong>${data.tp}</strong></div>
          <div class="status">
            <span class="light ${data.test ? 'on' : ''}"></span>
            <span>test: ${data.test ? 'true' : 'false'}</span>
          </div>
          <div class="result">hs × tp = ${product}</div>
        `;
      })
      .catch(error => {
        document.getElementById('content').innerHTML = `<p class="error">${error.message}</p>`;
      });
  </script>
</body>
</html>
