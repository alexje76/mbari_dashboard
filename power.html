<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buoy Dashboard - Power Usage</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/charts.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation Header -->
        <header class="header">
            <div class="header-content">
                <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation menu">☰</button>
                <h1>Buoy Dashboard</h1>
            </div>
        </header>

        <!-- Navigation Menu -->
        <nav id="navigationMenu" class="nav-menu nav-menu-closed">
            <ul>
                <li><a href="index.html" data-page="home">Homepage</a></li>
                <li><a href="selector.html" data-page="selector">Selector Display</a></li>
                <li><a href="power.html" data-page="power">Power Usage</a></li>
                <li><a href="nextwave.html" data-page="nextwave">Next Wave</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <p id="loadingIndicator" role="status">Loading data…</p>
            <p id="errorMessage" role="alert" hidden></p>

            <!-- Date Range Picker -->
            <div class="date-range-section">
                <label>Date Range:</label>
                <div id="dateRangePicker" class="date-range-picker">
                    <input type="date" id="startDate" class="date-input">
                    <span class="date-separator">–</span>
                    <input type="date" id="endDate" class="date-input">
                    <button id="applyDateRange" class="btn-apply">Apply</button>
                    <button id="resetDateRange" class="btn-reset">Past 2 Days</button>
                </div>
            </div>

            <!-- Discharge Offset Slider -->
            <div class="chart-container">
                <div class="slider-section">
                    <label for="dischargeOffset">Unmeasured discharge offset: <span id="dischargeOffsetValue">15</span> W</label>
                    <input type="range" id="dischargeOffset" min="0" max="100" step="1" value="15" list="dischargeMarks">
                    <datalist id="dischargeMarks">
                        <option value="15" label="15 · avg"></option>
                    </datalist>
                    <p class="slider-hint">Added to the discharge line and battery-life estimate only. The phantom line shows measured discharge without this offset.</p>
                </div>
            </div>

            <!-- Battery Chart -->
            <div class="chart-container full-width-chart">
                <h2>Battery Percentage</h2>
                <div id="chartBattery" class="chart"></div>
            </div>

            <!-- Power Chart (Avg Power + Power In + Discharge + Phantom) -->
            <div class="chart-container full-width-chart">
                <h2>Power</h2>
                <div id="chartPower" class="chart"></div>
            </div>

            <!-- Battery Life Chart -->
            <div class="chart-container full-width-chart">
                <h2>Estimated Battery Life</h2>
                <div id="chartBatteryLife" class="chart"></div>
                <ul id="batteryLifeSummary" class="battery-life-summary"></ul>
            </div>
        </main>
    </div>

    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- Shared Modules -->
    <script type="module" src="js/shared/colorScheme.js"></script>
    <script type="module" src="js/shared/dataFetcher.js"></script>
    <script type="module" src="js/shared/chartUtils.js"></script>
    <script type="module" src="js/shared/navigation.js"></script>
    <script type="module" src="js/utils/urlParams.js"></script>

    <!-- Page Module -->
    <script type="module" src="js/pages/power.js"></script>
</body>
</html>
