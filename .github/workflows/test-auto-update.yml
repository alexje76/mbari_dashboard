name: Pull Raw Data and Update Dashboard Data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  # Single change point: repoint this URL (and RAW_DATA_BRANCH) at the new
  # raw-data source (logs + telemetry) when it moves.
  RAW_DATA_URL: https://github.com/alexje76/OpenFiles_MBARIWEC
  RAW_DATA_BRANCH: main

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw data
        run: |
          git clone --depth 1 --branch "$RAW_DATA_BRANCH" "$RAW_DATA_URL" source
          python scripts/sync_raw.py --source source --dest raw
          rm -rf source

      - name: Process raw data into dashboard files
        run: python build_dashboard_data.py --input-dir raw --output-dir .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in raw data config .dashboard_state.json; do
            [ -e "$p" ] && git add "$p"
          done

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Automated dashboard data update"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"